name: Production Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK on EAS
        id: eas
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --wait --json)
          echo "$BUILD_JSON" > build.json
          BUILD_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "::error::Nessun buildUrl nel JSON"
            cat build.json
            exit 1
          fi
          echo "url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          curl -L --fail "${{ steps.eas.outputs.url }}" -o "lifeos-${{ github.ref_name }}.apk"
          ls -lh "lifeos-${{ github.ref_name }}.apk"
          sha256sum "lifeos-${{ github.ref_name }}.apk"

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          FILE="lifeos-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "LifeOS $TAG" \
              --generate-notes
          fi
