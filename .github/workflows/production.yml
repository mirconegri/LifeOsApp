name: Production Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK on EAS
        id: eas
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --wait --json)
          echo "$BUILD_JSON" > build.json
          BUILD_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl')
          if [ -z "$BUILD_URL" ] || [ "$BUILD_URL" = "null" ]; then
            echo "::error::Nessun buildUrl nel JSON"
            cat build.json
            exit 1
          fi
          echo "url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          curl -L --fail "${{ steps.eas.outputs.url }}" -o "lifeos-${{ github.ref_name }}.apk"
          ls -lh "lifeos-${{ github.ref_name }}.apk"
          file "lifeos-${{ github.ref_name }}.apk"
          sha256sum "lifeos-${{ github.ref_name }}.apk"
          if ! file "lifeos-${{ github.ref_name }}.apk" | grep -qi "Android package"; then
            echo "::error::Il file scaricato non è un APK. Controlla eas.json (buildType deve essere 'apk' per production)."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-apk-${{ github.ref_name }}
          path: lifeos-${{ github.ref_name }}.apk
          retention-days: 90
